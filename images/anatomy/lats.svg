<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-labelledby="t-lats">
  <title id="t-lats">Lats highlighted in gold on a simple back-view body outline</title>

  <!-- The shared body outline, drawn faintly so the highlight reads first. -->
  <g fill="#9a958c" fill-opacity="0.16" stroke="#9a958c" stroke-opacity="0.45"
     stroke-width="1" stroke-linejoin="round">
    <circle cx="100" cy="17" r="10"/>
    <rect x="95" y="25" width="10" height="9" rx="3"/>
    <path d="M78 34 L122 34 L126 40 L120 70 L116 90 L84 90 L80 70 L74 40 Z"/>
    <rect x="82" y="86" width="36" height="18" rx="6"/>
    <rect x="64" y="38" width="12" height="34" rx="6"/>
    <rect x="63" y="68" width="11" height="30" rx="5"/>
    <rect x="124" y="38" width="12" height="34" rx="6"/>
    <rect x="126" y="68" width="11" height="30" rx="5"/>
    <rect x="83" y="100" width="16" height="28" rx="7"/>
    <rect x="85" y="124" width="13" height="23" rx="6"/>
    <rect x="101" y="100" width="16" height="28" rx="7"/>
    <rect x="102" y="124" width="13" height="23" rx="6"/>
  </g>


  <!-- Spine line: marks this as the view from behind. -->
  <line x1="100" y1="36" x2="100" y2="86" stroke="#9a958c"
        stroke-opacity="0.45" stroke-width="1"/>

  <!-- THE HIGHLIGHT: the one region this card is about. -->
  <g fill="#d4af37" fill-opacity="0.92" stroke="#a8862a" stroke-width="1" stroke-linejoin="round">
    <path d="M79 45 L95 55 L93 80 L84 76 Z"/>
    <path d="M121 45 L105 55 L107 80 L116 76 Z"/>
  </g>

  <!-- Leader line and label, pointing at the highlighted region. -->
  <line x1="142" y1="66" x2="116" y2="66" stroke="#a8862a" stroke-opacity="0.7" stroke-width="1"/>
  <text x="145" y="69" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="9" fill="#a8862a">Lats</text>
  <text x="6" y="145" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="7" fill="#9a958c" fill-opacity="0.8">back view</text>
</svg>
