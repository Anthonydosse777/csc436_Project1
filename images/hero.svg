<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Illustration of a loaded barbell above four training blocks labelled push, pull, legs and core">
  <rect width="720" height="480" fill="#161a21"/>
  <g stroke="#222833" stroke-width="2">
    <path d="M0 120 H720 M0 240 H720 M0 360 H720 M180 0 V480 M360 0 V480 M540 0 V480"/>
  </g>
  <path d="M0 480 L720 0 L720 120 L120 480 Z" fill="#1c212b"/>

  <!-- barbell -->
  <line x1="120" y1="180" x2="600" y2="180" stroke="#e8ecf2" stroke-width="14" stroke-linecap="round"/>
  <rect x="132" y="128" width="26" height="104" rx="8" fill="#ff5a1f"/>
  <rect x="168" y="146" width="20" height="68" rx="7" fill="#ff5a1f"/>
  <rect x="562" y="128" width="26" height="104" rx="8" fill="#ff5a1f"/>
  <rect x="532" y="146" width="20" height="68" rx="7" fill="#ff5a1f"/>

  <!-- four training blocks -->
  <g fill="#1f2530" stroke="#2c3441" stroke-width="3">
    <rect x="96" y="286" width="120" height="120" rx="18"/>
    <rect x="252" y="286" width="120" height="120" rx="18"/>
    <rect x="408" y="286" width="120" height="120" rx="18"/>
    <rect x="564" y="286" width="60" height="120" rx="18"/>
  </g>
  <g fill="#8b95a5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="156" y="354">PUSH</text>
    <text x="312" y="354">PULL</text>
    <text x="468" y="354">LEGS</text>
  </g>
  <g fill="#ff5a1f">
    <rect x="126" y="372" width="60" height="6" rx="3"/>
    <rect x="282" y="372" width="60" height="6" rx="3"/>
    <rect x="438" y="372" width="60" height="6" rx="3"/>
  </g>
</svg>
